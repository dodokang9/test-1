<meta charset="UTF-8">
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리집 집들이 브런치</title>
  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      background-color: #faf7f2;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #2d2621;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    h1 {
      font-size: 2.2rem;
      margin: 20px 0 36px;
      letter-spacing: -0.5px;
      color: #4a3423;
    }
    .menu-list {
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .menu-item {
      background: #ffffff;
      padding: 24px 16px;
      border-radius: 18px;
      font-size: 1.6rem;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      border: 1px solid #eee5dc;
    }
    footer {
      margin-top: auto;
      padding-top: 40px;
      font-size: 1.1rem;
      color: #8c827a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>우리집 집들이 브런치</h1>
    <ul class="menu-list">
      <li class="menu-item">프렌치토스트</li>
      <li class="menu-item">그린샐러드</li>
      <li class="menu-item">오렌지주스</li>
    </ul>
    <footer>가상의 모임입니다</footer>
  </div>
</body>
</html>
